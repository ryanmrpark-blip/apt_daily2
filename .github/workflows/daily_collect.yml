name: Daily Apartment Sales Data Collection

on:
  schedule:
    # 매일 한국 시간 06:00 (UTC 21:00) 자동 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  collect-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Data Collection & Parquet Export
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          uv run python -m collector.run --days 7

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update recent apartment sales [skip ci]" && git push)
