[project]
name = "apt-daily"
version = "0.1.0"
description = "최근 1주간 전국 아파트 매매 실거래가 일일 자동 수집 및 Streamlit 대시보드"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.39.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "google-genai>=2.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
